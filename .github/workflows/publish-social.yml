name: Queue social posts to Buffer

on:
  schedule:
    - cron: "0 14 * * 0"   # 每週日 22:00 台北；腳本自己判斷是否到了下一批（每 3 週）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Queue next batch
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: python scripts/queue_batch_to_buffer.py
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/buffer-batch-state.json
          git diff --cached --quiet || (git commit -m "chore: update buffer batch state" && git push)
