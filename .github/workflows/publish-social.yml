name: Publish to Social Media

on:
  push:
    paths:
      - 'social-posts/pending/**'
  schedule:
    # 每週二、三、四、五 00:05 UTC（台北時間 08:05）
    - cron: '5 0 * * 2,3,4,5'
  workflow_dispatch:  # 允許手動觸發

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Determine publishing strategy
        id: strategy
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=scheduled" >> $GITHUB_OUTPUT
            echo "Publishing ONE post (scheduled mode)"
          else
            echo "mode=all" >> $GITHUB_OUTPUT
            echo "Publishing ALL pending posts (push mode)"
          fi

      - name: Publish pending posts to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PUBLISH_MODE: ${{ steps.strategy.outputs.mode }}
        run: python scripts/publish_to_buffer.py

      - name: Commit published/ moves and debug log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social-posts/
          git diff --cached --quiet || git commit -m "Move published posts to social-posts/published/ [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
