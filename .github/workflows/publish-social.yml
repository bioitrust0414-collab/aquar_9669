name: Publish Social Posts to Buffer

on:
  schedule:
    # 每週一、三、五的 UTC 00:05 (台北時間一、三、五 08:05) 觸發
    - cron: '5 0 * * 1,3,5'
  workflow_dispatch: # 允許在 GitHub Actions 頁面手動點擊執行

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # 關鍵：賦予 GitHub Actions 對倉庫內容的寫入權限，解決 git push 權限不足 (Exit code 128)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Buffer Publisher
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS }}
        run: |
          python scripts/publish_to_buffer.py

      - name: Commit and push published state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add social-posts/ docs/buffer-batch-state.json
          git diff --staged --quiet || git commit -m "chore: auto-archive published posts and update batch state"
          git push
