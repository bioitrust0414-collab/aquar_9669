name: Publish to Social Media

on:
  push:
    branches:
      - main
    paths:
      - 'social-posts/pending/**'
  schedule:
    # 每天 00:05 UTC 檢查一次是否已滿 21 天批次週期（實際發文節奏由
    # scripts/publish_to_buffer.py 的 docs/buffer-batch-state.json 控制）
    - cron: '5 0 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Determine publishing strategy
        id: strategy
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=scheduled" >> $GITHUB_OUTPUT
            echo "Checking scheduled 21-day batch (scheduled mode)"
          else
            echo "mode=all" >> $GITHUB_OUTPUT
            echo "Publishing ALL pending posts (push mode)"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "force=true" >> $GITHUB_OUTPUT
          else
            echo "force=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish pending posts to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PUBLISH_MODE: ${{ steps.strategy.outputs.mode }}
          FORCE_BATCH: ${{ steps.strategy.outputs.force }}
        run: python scripts/publish_to_buffer.py

      - name: Commit published/ moves and debug log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social-posts/
          if [ -f docs/buffer-batch-state.json ]; then
            git add docs/buffer-batch-state.json
          fi
          git diff --cached --quiet || git commit -m "Move published posts to social-posts/published/ [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
