- name: Commit updated push state
  if: always()
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "github-actions[bot]@users.noreply.github.com"
    if [ -f docs/digest-push-state.json ]; then
      git add docs/digest-push-state.json
      git diff --cached --quiet || git commit -m "Advance digest push state [skip ci]"
      git pull --rebase origin ${{ github.ref_name }}
      git push
    else
      echo "No state file to commit"
    fi
