name: Push to Aquar Digest

on:
  schedule:
    # 每週二、五 00:20 UTC（台北時間 08:20），與 Buffer 排程錯開
    - cron: '20 0 * * 2,5'
  workflow_dispatch:  # 允許手動觸發

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Push next pieces to aquar-digest
        env:
          DIGEST_REPO_TOKEN: ${{ secrets.DIGEST_REPO_TOKEN }}
          PUSH_COUNT: '2'
        run: python scripts/push_to_digest.py

      - name: Commit updated push state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/digest-push-state.json
          git diff --cached --quiet || git commit -m "Advance digest push state [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
